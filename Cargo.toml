[package]
name = "koji"
version = "3.4.0"
edition = "2021"
authors = [
  "Finley Thomalla <finley@thomalla.ch>",
  "Danny Tatom <its.danny@hey.com>",
]
description = "An interactive CLI for creating conventional commits."
documentation = "https://docs.rs/koji"
repository = "https://github.com/cococonscious/koji"
license = "MIT"

[[bin]]
name = "koji"
path = "src/bin/main.rs"

[lib]
name = "koji"
path = "src/lib/lib.rs"

[features]
default = ["ast-grep"]
ast-grep = ["dep:ast-grep-config", "dep:ast-grep-language"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
cocogitto = { version = "7.0", default-features = false }
conventional_commit_parser = "0.9.4"
dirs = "6.0"
emojis = "0.9.0"
indexmap = "2.10"
serde = { version = "1.0", features = ["derive"] }
inquire = "0.9.4"
regex = "1.12"
thiserror = "2.0"
clap_complete_command = { version = "0.6.1", features = ["nushell"]}
config = { version = "0.15.25", features = ["toml"] }
xdg = "3.0"
gix = "0.87.0"
ast-grep-config = { version = "0.45.0", optional = true }
ast-grep-language = { version = "0.45.0", optional = true }

[dev-dependencies]
git2 = "0.21.0"
assert_cmd = "2.0.16"
predicates = "3.1.2"
tempfile = "3.12.0"

[target.'cfg(not(windows))'.dev-dependencies]
rexpect = "0.7.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[profile.release]
opt-level = "z"
codegen-units = 1
